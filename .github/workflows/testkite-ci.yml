name: TestKite CI

on:
  push:
    paths:
      - 'testkite/**'
      # Sửa chính workflow này cũng phải chạy lại CI — nếu không, job db-tests thêm ở
      # commit T9 sẽ không bao giờ chạy trên chính commit giới thiệu nó.
      - '.github/workflows/testkite-ci.yml'
  pull_request:
    paths:
      - 'testkite/**'
      - '.github/workflows/testkite-ci.yml'
  # Nhịp riêng cho job `fleet-soak`: 200 chain synthetic mất vài phút và giá trị của nó là
  # XU HƯỚNG qua từng đêm, không phải tín hiệu per-commit. 02:00 UTC.
  schedule:
    - cron: '0 2 * * *'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare pnpm 9 via corepack
        run: corepack prepare pnpm@9 --activate

      - name: pnpm install (frozen lockfile)
        working-directory: testkite
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: testkite
        run: pnpm typecheck

      - name: Test
        working-directory: testkite
        run: pnpm test

      # zod là NGUỒN hợp đồng; packages/contract/openapi.json chỉ là ĐẦU RA đã commit.
      # Regen tại chỗ rồi `git diff --exit-code`: sửa schema mà quên `pnpm openapi:gen`
      # ⇒ CI đỏ kèm diff. Kiểm chứng cục bộ 2026-08-27: thêm một chữ vào OPENAPI_INFO
      # .description ⇒ exit 1 in ra đúng dòng lệch; trả nguyên trạng ⇒ exit 0.
      - name: Gate — OpenAPI spec drift (regen phải không đổi byte nào)
        working-directory: testkite
        run: pnpm openapi:check

      # `/internal/fleet` là mặt phẳng RIÊNG: Fastify riêng, cổng riêng, credential của fleet
      # chứ không phải token tenant. Nó cố ý KHÔNG nằm trong `ROUTES`
      # (packages/contract/src/routes/index.ts) nên không bao giờ được sinh ra ở đây. Gate này
      # grep BYTE đã commit — một tầng dưới test đơn vị trong openapi.test.ts — nên bắt được cả
      # trường hợp ai đó sửa tay openapi.json.
      - name: Gate — /internal must not leak into the public OpenAPI
        working-directory: testkite
        run: |
          if grep -n '"/internal' packages/contract/openapi.json; then
            echo "::error::/internal/fleet escaped into openapi.json (see the line above). The fleet plane is not part of the tenant API: keep INTERNAL_ROUTES out of the ROUTES array in packages/contract/src/routes/index.ts."
            exit 1
          fi
          echo "OpenAPI gate: no /internal path in the published spec."

      # DAG 12 module + compiler PURE + queue chỉ trong kernel: ba luật này trước B1–B3
      # chỉ nằm trong comment. Từ đây `pnpm lint` là thứ chặn chúng ở CI.
      - name: Gate — kiến trúc (DAG 12 module, compiler PURE, queue chỉ trong kernel)
        working-directory: testkite
        run: pnpm lint

      # Bước riêng, KHÔNG thừa dù `pnpm test` ở trên có chuỗi `&& pnpm test:tools`:
      # tools/lint-rules.test.ts là bằng chứng các luật ở gate trên VẪN BẮT được vi phạm
      # (fixture vi phạm thường trú + ESLint Node API). Gỡ chuỗi trong script `test` là
      # mất im lặng lớp bằng chứng đó; step này giữ nó đứng độc lập và gọi tên đúng gate
      # nào đỏ.
      - name: Gate — luật lint vẫn bắt được vi phạm (fixture + module DAG)
        working-directory: testkite
        run: pnpm run test:tools

      # madge canh vòng lặp GIÁ TRỊ lúc chạy (.madgerc bật skipTypeImports — vòng
      # `import type` giữa index.ts và các phase compiler bị TypeScript xoá lúc biên dịch).
      - name: Gate — không phụ thuộc vòng
        working-directory: testkite
        run: pnpm lint:cycles

      # Hai nguồn, hai lệnh.
      #  - SOURCE: một MODULE SPECIFIER có ngoặc kép, tức một import thật. Bản cũ grep chuỗi
      #    trần nên tự khớp chính comment "IMAGE RULE ... finding chromium fails the build"
      #    trong apps/core/src/main.ts (kiểm chứng 30-08-2026: grep khớp ⇒ `exit 1` ⇒ job đỏ
      #    bất kể code sạch hay bẩn — một gate luôn đỏ là một gate không ai đọc nữa).
      #  - MANIFEST: một dependency được khai báo — chính nó mới là thứ nhét binary vào image,
      #    kể cả khi chưa dòng nào import. `--include` của grep lọc cả file chỉ đích danh trên
      #    dòng lệnh, nên package.json phải là lệnh riêng.
      #  - SCOPE: bản 31-08-2026 neo tên driver NGAY SAU dấu nháy, nên `import test from
      #    "@playwright/test"` (scope `@playwright/` đứng trước) lọt qua — đo thực nghiệm:
      #    pattern cũ khớp 1/3 dạng xấu, pattern mới khớp 3/3. Một gate im lặng không phân biệt
      #    được với một cây sạch, nên NEGATIVE CONTROL chạy TRƯỚC khi quét cây thật: pattern
      #    nào không còn bắt cả ba dạng đã biết thì tự tố cáo ngay tại đây.
      - name: Gate — no browser in API image (apps/core must stay browser-free)
        run: |
          set -euo pipefail
          SPECIFIER="['\"](@?[a-z0-9@/.-]*)(playwright|puppeteer|chromium)[a-z0-9@/.-]*['\"]"
          KNOWN_BAD=$(cat <<'SAMPLE'
          import test from "@playwright/test";
          import { chromium } from "playwright-core";
          const pw = require("@playwright/test");
          SAMPLE
          )
          # String comparison, never `-ne`: an unparseable regex makes grep exit 2 with EMPTY
          # stdout, and `[ "" -ne 3 ]` is itself an ERROR (exit 2), which an `if` reads as
          # false — the self-check would then print "passed" for a pattern that matches
          # nothing. Measured 31-08-2026 while writing this step. `!=` is fail-closed: empty,
          # "0" and "2" all differ from "3".
          HITS=$(printf '%s\n' "$KNOWN_BAD" | grep -cE "$SPECIFIER" || true)
          if [ "$HITS" != "3" ]; then
            echo "::error::Browser-gate self-check FAILED: the pattern matched '$HITS' of the 3 known-bad import forms (empty means grep could not even parse it). Fix the pattern before trusting a clean scan — a gate that matches nothing looks exactly like a clean tree."
            exit 1
          fi
          echo "Browser gate self-check: pattern matches all 3 known-bad forms."
          if grep -rEn "$SPECIFIER" testkite/apps/core/src --include='*.ts'; then
            echo "::error::apps/core imports a browser driver (line above). Running tests is a capability of the fleet (apps/runner), never of the API image."
            exit 1
          fi
          if grep -En "playwright|puppeteer|chromium" testkite/apps/core/package.json; then
            echo "::error::apps/core declares a browser dependency. A declared dependency ships in the image whether or not a single line imports it."
            exit 1
          fi
          echo "Browser gate: clean."

      # The gate above keeps apps/core browser-free; this one covers the other half — the shared
      # packages every image pulls in — plus the POSITIVE side nobody else checks: apps/runner must
      # not LOSE its browser dependency (a runner that quietly stops shipping chromium turns every
      # chain into an infra error instead of a verdict).
      #
      # It anchors on a real import statement rather than the bare driver name, for the reason
      # measured on 30-08-2026 one step above: text that merely NAMES the driver is not a browser in
      # the image — packages/verb-kit carries `// TODO(M4): import type { Page } from
      # "playwright-core"` and run-compiler carries the `"chromium-headless-shell"` engine literal.
      # A name-grep would paint both red forever, and a permanently red gate is a gate nobody reads.
      # Measured both ways 31-08-2026: 0 hits across apps/core/src + packages/*/src, 2 hits in
      # apps/runner/src/browser/playwright-engine.ts (so the pattern does find a real import).
      #
      # Cùng lỗ hổng SCOPE như step trên: bản cũ neo `playwright` ngay sau dấu nháy nên
      # `import test from "@playwright/test"` và `require("@playwright/test")` đi lọt (đo
      # 31-08-2026: 1/3). Negative control ở đầu step chạy pattern trên 5 dòng mẫu — 3 dạng
      # xấu + 2 decoy HỢP LỆ có thật trong cây (comment `// TODO(M4)` của verb-kit và literal
      # `"chromium-headless-shell"` của run-compiler) — và đòi ĐÚNG 3 hit: thiếu thì gate mù,
      # thừa thì gate đỏ vĩnh viễn. Cả hai đều là gate không ai đọc nữa.
      - name: Gate — playwright only in the runner image
        run: |
          set -euo pipefail
          IMPORTS='^\s*(import|export)[^\x22\x27]*[\x22\x27]@?[a-z0-9@.-]*/?(playwright|puppeteer)[a-z0-9@/.-]*[\x22\x27]|(import|require)\(\s*[\x22\x27]@?[a-z0-9@.-]*/?(playwright|puppeteer)'
          SAMPLE=$(cat <<'SAMPLE'
          import test from "@playwright/test";
          import { chromium } from "playwright-core";
          const pw = require("@playwright/test");
          // TODO(M4): import type { Page } from "playwright-core"
          const engine = "chromium-headless-shell";
          SAMPLE
          )
          # `!=` and not `-ne`, for the reason spelled out in the step above: an empty $HITS
          # from a grep that could not parse the pattern would make `[ "$HITS" -ne 3 ]` error
          # out, and an erroring test reads as "condition false", i.e. as a pass.
          HITS=$(printf '%s\n' "$SAMPLE" | grep -cP "$IMPORTS" || true)
          if [ "$HITS" != "3" ]; then
            echo "::error::Runner-only browser gate self-check FAILED: the pattern matched '$HITS' of the sample's 5 lines, expected exactly the 3 real imports (the other 2 lines are legitimate text that merely names a driver; an empty count means grep could not parse the pattern). Fix the pattern before trusting a clean scan."
            exit 1
          fi
          echo "Runner-only browser gate self-check: 3 real imports caught, 2 decoys ignored."
          if grep -rPn "$IMPORTS" testkite/apps/core/src testkite/packages/*/src --include='*.ts'; then
            echo "::error::A browser driver is imported outside apps/runner (line above). Driving a browser is a capability of the fleet image only."
            exit 1
          fi
          if grep -En "playwright|puppeteer" testkite/apps/core/package.json testkite/packages/*/package.json; then
            echo "::error::A shared package declares a browser dependency; it would ship in the API image too."
            exit 1
          fi
          grep -q '"playwright-core"' testkite/apps/runner/package.json \
            || { echo "::error::apps/runner lost its browser dependency."; exit 1; }
          echo "Runner-only browser gate: clean."

      # A container manifest without a memory limit is exactly how the old system died
      # (docs/SYSTEM_DESIGN.md §1). apps/runner/test/deploy/manifest.test.ts already cross-checks the
      # manifest against memory-governance.ts; this step is the same rule read straight off the
      # committed JSON, so it survives someone deleting the test. Measured 31-08-2026: flipping one
      # lane to "swap": true exits 1 with `lane batch must disable swap`.
      - name: Gate — every runner lane declares a memory limit
        working-directory: testkite
        run: |
          node -e '
            const m = require("./apps/runner/deploy/runner-manifest.json");
            for (const [lane, cfg] of Object.entries(m.lanes)) {
              if (!(cfg.memoryMb > 0)) { console.error(`lane ${lane} has no memoryMb`); process.exit(1); }
              if (cfg.swap !== false) { console.error(`lane ${lane} must disable swap`); process.exit(1); }
            }
            console.log("manifest memory limits: ok");'

      # `systemd-analyze verify` returns exit 0 on a unit whose directives it could not parse, so
      # this script judges its OUTPUT (see the header of verify-units.sh, and the self-proof suite
      # apps/runner/test/deploy/verify-units.test.ts which feeds it a deliberately broken unit).
      # It exits 2 — a loud red, never a silent pass — if systemd-analyze is missing from the image.
      # This proves the units PARSE. That systemd APPLIES them is host-pilot evidence: CI never
      # boots the fleet.
      - name: Gate — systemd unit syntax
        run: bash testkite/scripts/verify-units.sh testkite/apps/runner/deploy/systemd

      # Language rule (CLAUDE.md Luật 4 + the i18n-code cleanup pass): source code and
      # tests are English; Vietnamese stays confined to docs/. Scans the same 4 trees the
      # i18n-code cleanup swept, PLUS the workspace's root-level config/scripts (also
      # code, just not under src/test) — eslint.config.mjs, any root *.ts config, the
      # scripts/ dir, and each app's vitest.config.ts / drizzle.config.ts.
      # apps/runner/src + apps/runner/test joined the list at M3-fleet T1, when the runner
      # stopped being a two-file stub: the fleet half of M3 is written here, and a tree that
      # is not scanned is a tree that drifts back to Vietnamese one comment at a time.
      # apps/runner/deploy joined at the M3 polish wave for exactly that reason: the systemd
      # units and runner-manifest.json ARE the fleet's production configuration — code by any
      # useful definition — and they were the last unscanned tree under apps/.
      # packages/run-compiler/fixtures/ is deliberately OUT of scope here — it's compiler
      # test DATA (not src/), and its Vietnamese case/step names feed into the golden
      # contentHash, so translating it needs a dedicated, hash-verified golden regen
      # rather than a blanket rewrite.
      - name: Gate — language (code/test must be English, docs stay Vietnamese)
        run: |
          set -euo pipefail
          shopt -s nullglob
          export LC_ALL=C.utf8
          PATTERN='[àáảãạăằắẳẵặâầấẩẫậđèéẻẽẹêềếểễệìíỉĩịòóỏõọôồốổỗộơờớởỡợùúủũụưừứửữựỳýỷỹỵÀÁẢÃẠĂẰẮẲẴẶÂẦẤẨẪẬĐÈÉẺẼẸÊỀẾỂỄỆÌÍỈĨỊÒÓỎÕỌÔỒỐỔỖỘƠỜỚỞỠỢÙÚỦŨỤƯỪỨỬỮỰỲÝỶỸỴ]'
          TARGETS=(
            testkite/apps/core/src testkite/apps/core/test
            testkite/apps/runner/src testkite/apps/runner/test testkite/apps/runner/deploy
            testkite/packages/*/src testkite/tools
            testkite/*.mjs testkite/*.ts testkite/scripts
            testkite/apps/*/vitest.config.ts testkite/apps/*/drizzle.config.ts
          )
          if grep -rlP "$PATTERN" "${TARGETS[@]}" 2>/dev/null; then
            echo "::error::Vietnamese text found in the source/test files listed above. Rule: code and tests must be written in English (comments, identifiers, test names, error/log/diagnostic messages); Vietnamese is reserved for documentation under docs/. Translate the flagged strings to English, or — if the Vietnamese is genuinely test DATA (not code) — move it under a directory this gate excludes and document why."
            exit 1
          fi
          echo "Language gate: clean."

      # Bộ T4 của blueprint §4 là "không thương lượng" ⇒ nó phải là một STEP RIÊNG,
      # gọi đúng tên khi đỏ, chứ không lẫn trong `pnpm test`.
      - name: Gate — cách ly tenant L3 (token team B + id team A phải ra 404)
        working-directory: testkite
        run: pnpm --filter @testkite/core test test/isolation/

      # Secret không bao giờ được lọt vào code. `tk_` là tiền tố token của TestKite.
      - name: Gate — không hard-code secret/token trong source
        run: |
          if grep -rEn "tk_[0-9a-f]{8}_[A-Za-z0-9_-]{20,}" testkite/apps testkite/packages \
               --include='*.ts' --include='*.json' | grep -v "test/"; then
            echo "Có token TestKite thật trong source (ngoài test)."; exit 1
          fi

      # Never-grantable là danh sách của blueprint §3, không phải quy ước. Đổi nó phải
      # đi kèm đổi blueprint — gate này bắt hai bên phải khớp.
      - name: Gate — danh sách never-grantable khớp blueprint
        working-directory: testkite
        run: |
          for p in "secret:write" "quota:set" "element:write" "token:issue:service" "team:purge"; do
            grep -q "\"$p\"" apps/core/src/modules/identity/rbac/permissions.ts \
              || { echo "never-grantable thiếu $p"; exit 1; }
            grep -q "$p" ../docs/SYSTEM_DESIGN.md \
              || { echo "$p không còn trong blueprint §3"; exit 1; }
          done

  # Tầng test thứ hai: Postgres THẬT. Job build-and-test ở trên chạy PGlite (một
  # connection wasm) nên tuyệt đối không chứng minh được tranh chấp khoá; suite
  # test/concurrency tự skip ở đó và CHỈ chạy thật ở job này.
  db-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: testkite
          POSTGRES_DB: testkite
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # PostgreSQL 17 là ENGINE CÓ THẨM QUYỀN. PGlite (18.x wasm) chỉ là vòng lặp
      # nhanh cho dev; lệch hành vi giữa hai bên thì tin job này.
      TESTKITE_TEST_PG_URL: postgres://postgres:testkite@127.0.0.1:5432/testkite
      # Không có URL ⇒ `describeRealPg` skip. Trên máy dev đó là đúng; ở ĐÂY nó là thảm hoạ
      # im lặng: 12 file test/concurrency in ra chữ "skipped" và job vẫn XANH, tức job tồn tại
      # để chứng minh tranh chấp khoá lại không chứng minh gì. Biến này khai báo Ý ĐỊNH, và
      # `resolveRealPgMode` (apps/core/test/harness/realpg.ts) NÉM LỖI thay vì skip khi URL
      # rỗng — tự chứng bằng test/harness/realpg-mode.test.ts.
      TESTKITE_REQUIRE_PG: '1'
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack prepare pnpm@9 --activate
      - name: pnpm install (frozen lockfile)
        working-directory: testkite
        run: pnpm install --frozen-lockfile
      - name: Test DB (PGlite + Postgres 17 thật)
        working-directory: testkite
        run: pnpm --filter @testkite/core test
      # Local check 2026-08-27: adding one column to the schema then running
      # `pnpm db:generate` writes 0007_*.sql AND edits `drizzle/meta/_journal.json`
      # (a tracked file), so `git diff --exit-code` catches the drift; when the schema
      # is unchanged, generate is a no-op.
      # `if: always()` is load-bearing (polish review NIT-56): without it, a failing test
      # step short-circuits the job and drift ships unnoticed behind an unrelated red.
      - name: Gate — migration drift (schema changed without a generated migration)
        if: always()
        working-directory: testkite/apps/core
        run: |
          pnpm db:generate
          git diff --exit-code -- drizzle/ \
            || { echo "Schema changed but the migration was never committed. Run: pnpm db:generate"; exit 1; }

  # Tầng test thứ ba: SOAK. `build-and-test` chạy trên FakeBrowserEngine nên không nói được gì
  # về bộ nhớ thật; job này chạy 200 chain synthetic qua chromium THẬT + `FakeControlPlane` và
  # khẳng định 4 trần của §5 (sàn RSS node không trôi, cây chromium dưới trần L1, không rò
  # context, không orphan chromium). Nightly vì nó mất vài phút và giá trị là XU HƯỚNG.
  #
  # Runner của GitHub chạy uid non-root ⇒ `launchSoakEngine` KHÔNG dùng lối thoát
  # `off-root-dev-only`: đây là nơi duy nhất chromium chạy CÓ SANDBOX ở quy mô 200 chain.
  # Sandbox dev (uid 0) thì không thể — xem đầu file apps/runner/test/soak/soak-200.test.ts.
  fleet-soak:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack prepare pnpm@9 --activate
      - name: pnpm install (frozen lockfile)
        working-directory: testkite
        run: pnpm install --frozen-lockfile
      # `playwright-core` (không phải `playwright`) là dependency của runner — nó cũng ship CLI
      # cài browser. Gọi sai tên gói ⇒ job đỏ ngay ở bước này, không phải lúc launch.
      - name: Install chromium-headless-shell
        working-directory: testkite
        run: pnpm --filter @testkite/runner exec playwright-core install --with-deps chromium-headless-shell
      # NƠI DUY NHẤT bất biến sandbox được nghiệm thu. `test/host/**` bị `vitest.config.ts`
      # loại khỏi mọi lần chạy mặc định và chỉ được nhận lại bởi `TESTKITE_HOST_CGROUP=1` —
      # biến mà script `test:host` tự đặt và trước đợt polish M3 KHÔNG job nào từng đặt, kể cả
      # nightly ⇒ `test/host/chromium-sandbox.test.ts` chưa từng chạy trong bất kỳ pipeline nào.
      #
      # Nó phải chạy Ở ĐÂY và không ở đâu khác: dev/CI mặc định chạy uid 0, mà zygote của
      # chromium TỪ CHỐI sandbox dưới root, nên `launchPlaywrightEngine` phải thêm
      # `--no-sandbox`. Runner của GitHub chạy non-root — đúng hình thái production (uid 10001,
      # docs/SYSTEM_DESIGN.md §5) — nên chỉ ở đây mới đọc được `/proc/<pid>/cmdline` của một
      # lần launch MẶC ĐỊNH và khẳng định `--no-sandbox` VẮNG MẶT. Đừng tuyên bố ngược ở nơi
      # khác: ngoài job này, "chromium có sandbox" là một giả định chưa ai đo.
      #
      # Đứng TRƯỚC soak: soak mất vài phút, và một sandbox hỏng là tin xấu phải biết ngay.
      # Bằng chứng cần thấy ở nightly kế tiếp: số test của `test/host` > 0.
      #
      # Chốt uid ĐI KÈM, không phải trang trí: `chromium-sandbox.test.ts` tự skip khi uid = 0,
      # và `vitest run` trên một file skip hết vẫn exit 0. Không có chốt này thì một runner đổi
      # sang root sẽ biến step thành đúng thứ cả lô fix này đang dẹp — một gate xanh im lặng
      # chẳng chứng minh gì. Đo cục bộ 31-08-2026 (sandbox này chạy root): 9 test, skip cả 9.
      - name: Host-shape tests (chromium sandbox, cgroup v2)
        working-directory: testkite
        run: |
          set -euo pipefail
          if [ "$(id -u)" -eq 0 ]; then
            echo "::error::This step runs as uid 0, so test/host/chromium-sandbox.test.ts skips itself and the step would pass while proving nothing. The sandbox invariant is only observable off root — keep this job on a non-root runner."
            exit 1
          fi
          pnpm --filter @testkite/runner test:host
      - name: Soak 200 synthetic chains
        working-directory: testkite
        run: pnpm --filter @testkite/runner test:soak
